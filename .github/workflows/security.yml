# Section 1B Q2 + Q6: security gates on every push and pull request.
# Order = cheapest first. Any ERROR blocks the merge (set as required checks in branch protection).
name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }          # full history: a key deleted in a later commit is still leaked
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
      - name: Scan full git history
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner -v --report-format sarif --report-path gitleaks.sarif
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: gitleaks-report, path: gitleaks.sarif }

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.181.0
    steps:
      - uses: actions/checkout@v4
      - name: Full report (stock rulesets + our AI-code rules)
        run: semgrep scan --metrics=off --config p/python --config p/owasp-top-ten --config .semgrep/ --sarif -o semgrep.sarif
      - name: Gate - fail on ERROR severity only (WARNING = human review)
        run: semgrep scan --metrics=off --config p/python --config p/owasp-top-ten --config .semgrep/ --severity ERROR --error
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: semgrep-report, path: semgrep.sarif }

  sca:
    name: SCA + hallucinated packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Do the packages exist? (slopsquatting / AI hallucination)
        run: python scripts/check_deps_exist.py
      - name: Known vulnerabilities, including transitive deps (pip-audit, OSV + PyPI advisory data)
        run: |
          pip install pip-audit==2.9.0
          status=0
          for f in $(git ls-files '*requirements*.txt'); do
            out="audit-$(echo $f | tr / _).md"
            echo "::group::$f"
            pip-audit -r "$f" --desc --format markdown --output "$out" || status=1
            [ -f "$out" ] && cat "$out" || echo "No known vulnerabilities found" | tee "$out"
            echo "::endgroup::"
          done
          exit $status
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: sca-report, path: "audit-*.md" }

  abuse-tests:
    name: Guardrail unit + abuse-case tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - working-directory: ai-proxy
        run: |
          pip install -r requirements.txt pytest
          pytest -v test_guardrails.py test_abuse_cases.py

  dast:
    name: DAST (ZAP API scan) - ${{ matrix.api }} - WAF ${{ matrix.waf }}
    needs: [secrets, sast]               # don't spend minutes scanning code that already failed
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [appointments, patients]
        # On            = what an attacker sees in production (WAF blocking)
        # DetectionOnly = the APIs' own weaknesses, normally hidden behind the WAF
        waf: [On, DetectionOnly]
    env:
      MODSEC_RULE_ENGINE: ${{ matrix.waf }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Export OpenAPI specs (ZAP's spider can't discover a JSON API)
        run: |
          pip install -r apis/patients/requirements.txt
          python scripts/export_openapi.py

      - name: Credentials for this API (lab placeholders; production = repo secrets)
        run: |
          if [ "${{ matrix.api }}" = "patients" ]; then
            TOKEN=$(JWT_TTL=3600 python scripts/make_jwt.py)
            echo "::add-mask::$TOKEN"
            echo "AUTH_HEADER=Authorization" >> $GITHUB_ENV
            echo "AUTH_VALUE=Bearer $TOKEN" >> $GITHUB_ENV
          else
            echo "AUTH_HEADER=x-api-key" >> $GITHUB_ENV
            echo "AUTH_VALUE=CHANGE_ME_lab_only_api_key" >> $GITHUB_ENV
          fi

      - name: Start the lab and confirm auth works BEFORE scanning
        run: |
          # CI copy only: lift Kong's per-minute limits so ZAP tests the API, not the throttle.
          # (Run #6: the patients scan hit the 30/min limit and most attacks came back 429.
          #  Rate limiting itself is proven separately by lab test 6.)
          sed -i 's/minute: [0-9]*,/minute: 100000,/' gateway/kong.yml
          docker compose up -d --build
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "$AUTH_HEADER: $AUTH_VALUE" http://localhost:8080/v1/${{ matrix.api }}${{ matrix.api == 'patients' && '/P001' || '' }}) && [ "$code" = "200" ] && break
            sleep 3
          done
          echo "authenticated request returned HTTP $code"; [ "$code" = "200" ]

      - name: ZAP API scan (every endpoint, method and parameter from the spec)
        # ZAP_AUTH_HEADER / ZAP_AUTH_HEADER_VALUE: ZAP adds the credential to every request
        # -I: WARN rules don't fail the build, only FAIL rules in zap/rules.tsv do
        run: |
          # Spec passed as a LOCAL FILE: ZAP then targets the spec's own server (http://localhost:8080/v1).
          # Fetching it from a URL made ZAP attack the host serving the file instead (found via the coverage check).
          mkdir -p zap-out && cp zap/rules.tsv zap/${{ matrix.api }}-openapi.json zap-out/ && chmod -R 777 zap-out
          docker run --rm --network host -v "$PWD/zap-out:/zap/wrk:rw" \
            -e ZAP_AUTH_HEADER="$AUTH_HEADER" -e ZAP_AUTH_HEADER_VALUE="$AUTH_VALUE" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t /zap/wrk/${{ matrix.api }}-openapi.json -f openapi \
              -c rules.tsv -I -r report.html -w report.md -J report.json

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-${{ matrix.api }}-waf-${{ matrix.waf }}
          path: zap-out/report.*

      - name: Coverage check - did the attacks actually reach the API?
        if: always()
        run: |
          docker compose logs --no-log-prefix kong > kong.log 2>&1
          docker compose logs --no-log-prefix waf > waf-${{ matrix.api }}-${{ matrix.waf }}.log 2>&1
          python - <<'PY' | tee -a $GITHUB_STEP_SUMMARY
          import json, collections
          kong = collections.Counter()
          for line in open("kong.log", errors="ignore"):
              try:
                  r = json.loads(line[line.index("{"):])
                  kong[r["response"]["status"]] += 1
              except Exception:
                  pass
          waf403 = sum('"http_code":403' in l for l in open("waf-${{ matrix.api }}-${{ matrix.waf }}.log", errors="ignore"))
          total = sum(kong.values())
          print("### Coverage: ${{ matrix.api }} / WAF ${{ matrix.waf }}")
          print(f"- Requests that reached Kong: **{total}**  (by status: {dict(sorted(kong.items()))})")
          print(f"- Blocked by the WAF (403): **{waf403}**")
          ok = sum(v for k, v in kong.items() if k < 300 or k == 422)
          print(f"- Reached the API with valid auth (2xx/422): **{ok}**"
                + ("  - LOW COVERAGE: check auth before trusting this report" if ok < 20 else ""))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.api }}-waf-${{ matrix.waf }}
          path: waf-*.log
      - if: always()
        run: docker compose down -v